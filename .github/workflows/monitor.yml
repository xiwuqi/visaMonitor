name: visaMonitor Historical Records

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'monitor = new historical date keys; baseline = suppress backlog; status = snapshot; test = transport test'
        type: choice
        default: monitor
        options: [monitor, baseline, status, test]

concurrency:
  group: visamonitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.VISA_HISTORY_ENABLED == '1'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Python package
        run: |
          python -m pip --version >/dev/null 2>&1 || python -m ensurepip --upgrade
          python -m pip install --no-cache-dir --break-system-packages -r requirements.txt \
            || python -m pip install --no-cache-dir -r requirements.txt
      - name: Run unit and offline DOM tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          VISA_TEST_CHROMIUM: bundled
        run: python -m unittest discover -s tests -v
      - name: Restore historical monitor state
        id: state
        if: inputs.mode != 'status' && inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: history-state.json
          key: visamonitor-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            visamonitor-history-v2-
      - name: Observe public historical records
        id: monitor
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          VISA_NTFY_TOPIC: ${{ secrets.VISA_NTFY_TOPIC }}
          VISA_CITIES: ${{ vars.VISA_CITIES }}
          VISA_TYPE: ${{ vars.VISA_TYPE }}
          VISA_CUTOFF: ${{ vars.VISA_CUTOFF }}
          PYTHONUTF8: '1'
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            baseline) python monitor.py --baseline ;;
            status) python monitor.py --check ;;
            test) python monitor.py --test-push ;;
            ''|monitor) python monitor.py --once ;;
            *) echo 'Unknown mode'; exit 1 ;;
          esac
      - name: Save historical monitor state
        # Save only a successfully processed state. Failed pushes must retry.
        if: success() && inputs.mode != 'status' && inputs.mode != 'test'
        uses: actions/cache/save@v4
        with:
          path: history-state.json
          key: visamonitor-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify saved state cache exists
        id: verify_cache
        if: success() && inputs.mode != 'status' && inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: history-state.json
          key: visamonitor-history-v2-${{ github.run_id }}-${{ github.run_attempt }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require exact saved cache acknowledgement
        if: success() && inputs.mode != 'status' && inputs.mode != 'test'
        env:
          CACHE_HIT: ${{ steps.verify_cache.outputs.cache-hit }}
        run: test "$CACHE_HIT" = 'true'
